{% extends "base.html" %}
{% block title %}Line wait | PR Kitchen{% endblock %}
{% block content %}
<h1>How long is the line?</h1>
<form method="post" enctype="multipart/form-data">
  <label>Photo of the line
    <input type="file" name="image" accept="image/*" capture="environment" required />
  </label>
  <label>Average service time per person (minutes)
    <input type="number" name="avg_service_minutes" min="0" step="0.1" required />
  </label>
  <button type="submit">Estimate wait</button>
</form>
<!-- TODO: show people count and estimated wait -->
{% endblock %}
